<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#fbfbfa"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">
    System Design — Local Financial Document Extraction Pipeline
  </text>

  <!-- Input -->
  <rect x="400" y="60" width="200" height="50" rx="8" fill="#e8eef7" stroke="#3b5a8a" stroke-width="1.5"/>
  <text x="500" y="90" text-anchor="middle" font-size="14" fill="#1a1a1a">Scanned Document</text>

  <!-- Pre-processing -->
  <rect x="400" y="140" width="200" height="50" rx="8" fill="#e8eef7" stroke="#3b5a8a" stroke-width="1.5"/>
  <text x="500" y="165" text-anchor="middle" font-size="13" fill="#1a1a1a">Pre-processing</text>
  <text x="500" y="181" text-anchor="middle" font-size="10" fill="#555">deskew · contrast · denoise</text>

  <line x1="500" y1="110" x2="500" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Split into two branches -->
  <line x1="500" y1="190" x2="500" y2="215" stroke="#333" stroke-width="1.5"/>
  <line x1="270" y1="215" x2="730" y2="215" stroke="#333" stroke-width="1.5"/>
  <line x1="270" y1="215" x2="270" y2="235" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="215" x2="730" y2="235" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>

  <!-- LEFT BRANCH: core pipeline -->
  <text x="270" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#3b5a8a">CORE PIPELINE</text>

  <rect x="150" y="240" width="240" height="55" rx="8" fill="#dcecdc" stroke="#3f7d3f" stroke-width="1.5"/>
  <text x="270" y="263" text-anchor="middle" font-size="13" fill="#1a1a1a">OCR Engine</text>
  <text x="270" y="280" text-anchor="middle" font-size="10" fill="#555">PaddleOCR / TrOCR</text>

  <line x1="270" y1="295" x2="270" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="130" y="325" width="280" height="55" rx="8" fill="#dcecdc" stroke="#3f7d3f" stroke-width="1.5"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#1a1a1a">Text + bounding boxes + confidence</text>
  <text x="270" y="365" text-anchor="middle" font-size="10" fill="#555">(intermediate output)</text>

  <line x1="270" y1="380" x2="270" y2="410" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="130" y="410" width="280" height="60" rx="8" fill="#dcecdc" stroke="#3f7d3f" stroke-width="1.5"/>
  <text x="270" y="435" text-anchor="middle" font-size="13" fill="#1a1a1a">LLM Extraction</text>
  <text x="270" y="452" text-anchor="middle" font-size="10" fill="#555">Phi-3 Mini / Mistral 7B GGUF</text>
  <text x="270" y="465" text-anchor="middle" font-size="10" fill="#555">+ JSON schema prompt</text>

  <!-- RIGHT BRANCH: ablation -->
  <text x="730" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#888">ABLATION (optional)</text>

  <rect x="610" y="240" width="240" height="60" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="730" y="263" text-anchor="middle" font-size="13" fill="#444">OCR-free VLM</text>
  <text x="730" y="280" text-anchor="middle" font-size="10" fill="#666">PaddleOCR-VL (~0.9B)</text>
  <text x="730" y="294" text-anchor="middle" font-size="10" fill="#666">image → JSON directly</text>

  <line x1="730" y1="300" x2="730" y2="410" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>

  <!-- Merge to JSON output -->
  <line x1="270" y1="470" x2="270" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="270" y1="500" x2="500" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="730" y1="410" x2="730" y2="500" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="730" y1="500" x2="500" y2="500" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="500" y1="500" x2="500" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="380" y="520" width="240" height="50" rx="8" fill="#fdeecb" stroke="#a87f22" stroke-width="1.5"/>
  <text x="500" y="550" text-anchor="middle" font-size="14" fill="#1a1a1a">Structured JSON Output</text>

  <!-- Split to UI and Evaluation -->
  <line x1="500" y1="570" x2="500" y2="595" stroke="#333" stroke-width="1.5"/>
  <line x1="270" y1="595" x2="730" y2="595" stroke="#333" stroke-width="1.5"/>
  <line x1="270" y1="595" x2="270" y2="615" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="595" x2="730" y2="615" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="615" width="240" height="55" rx="8" fill="#e8eef7" stroke="#3b5a8a" stroke-width="1.5"/>
  <text x="270" y="638" text-anchor="middle" font-size="13" fill="#1a1a1a">Streamlit UI</text>
  <text x="270" y="655" text-anchor="middle" font-size="10" fill="#555">upload → view extracted fields</text>

  <rect x="610" y="615" width="240" height="55" rx="8" fill="#f0dede" stroke="#a03d3d" stroke-width="1.5"/>
  <text x="730" y="638" text-anchor="middle" font-size="13" fill="#1a1a1a">Evaluation</text>
  <text x="730" y="655" text-anchor="middle" font-size="10" fill="#555">vs. SROIE / CORD ground truth</text>

  <line x1="730" y1="670" x2="730" y2="700" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="590" y="700" width="280" height="65" rx="8" fill="#f0dede" stroke="#a03d3d" stroke-width="1.5"/>
  <text x="730" y="724" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Failure Taxonomy</text>
  <text x="730" y="741" text-anchor="middle" font-size="10" fill="#555">missing field · wrong value ·</text>
  <text x="730" y="754" text-anchor="middle" font-size="10" fill="#555">wrong structure · domain ambiguity</text>

  <!-- Legend -->
  <rect x="40" y="700" width="14" height="14" fill="#dcecdc" stroke="#3f7d3f"/>
  <text x="60" y="712" font-size="11" fill="#333">Core pipeline (always run)</text>

  <rect x="40" y="722" width="14" height="14" fill="#f2f2f2" stroke="#999" stroke-dasharray="3,2"/>
  <text x="60" y="734" font-size="11" fill="#333">Optional ablation (if timeline permits)</text>

  <rect x="40" y="744" width="14" height="14" fill="#f0dede" stroke="#a03d3d"/>
  <text x="60" y="756" font-size="11" fill="#333">Primary research output</text>
</svg>
